<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bùi Thị Tú Anh — CV</title>
<meta name="description" content="Creator Partnership | KOC/KOL Booking | E-commerce | Customer Service">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf3f5; --paper:#ffffff; --ink:#2b1d24; --ink-2:#5c4a53; --muted:#8a8f9c;
  --line:#f3dde2; --accent:#d4607c; --accent-soft:#fbe3e9; --navy:#3a2430; --navy-2:#fff;
  --gold:#c9566f; --chip:#fbeef1; --cell-off:#f6e6ea;
  --c1:#d4607c; --c2:#7a3b5c; --c3:#eba3b5; --c4:#b49ac4;
  --shadow:0 1px 2px rgba(180,90,110,.06),0 10px 40px rgba(212,96,124,.10);
}
@media not all{
  :root:not([data-theme="light"]){
    --bg:#13161d; --paper:#1a1e27; --ink:#eef0f4; --ink-2:#c3c8d3; --muted:#8a91a0;
    --line:#2b313d; --accent:#e27a60; --accent-soft:#3a2722; --navy:#0f1320; --navy-2:#222a3f;
    --gold:#d6aa5e; --chip:#252a35; --cell-off:#232834;
    --c1:#e27a60; --c2:#5bb0b3; --c3:#d6aa5e; --c4:#9298e0;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#13161d; --paper:#1a1e27; --ink:#eef0f4; --ink-2:#c3c8d3; --muted:#8a91a0;
  --line:#2b313d; --accent:#e27a60; --accent-soft:#3a2722; --navy:#0f1320; --navy-2:#222a3f;
  --gold:#d6aa5e; --chip:#252a35; --cell-off:#232834;
  --c1:#e27a60; --c2:#5bb0b3; --c3:#d6aa5e; --c4:#9298e0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* ---------- Language gate ---------- */
#gate{position:fixed;inset:0;z-index:50;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .5s,visibility .5s}
#gate.hide{opacity:0;visibility:hidden}
.gate-box{text-align:center;max-width:520px;width:100%}
.gate-photo{width:120px;height:120px;border-radius:50%;object-fit:cover;object-position:center 22%;border:3px solid rgba(255,255,255,.15);margin-bottom:22px}
.gate-name{font-family:"Playfair Display",serif;font-size:clamp(30px,6vw,44px);letter-spacing:.5px}
.gate-sub{color:rgba(255,255,255,.6);font-size:12px;letter-spacing:2.5px;text-transform:uppercase;margin:8px 0 36px}
.gate-btns{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gate-btns button{cursor:pointer;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:#fff;border-radius:14px;padding:22px 16px;font:inherit;transition:.25s}
.gate-btns button:hover{background:#fff;color:var(--navy);transform:translateY(-2px)}
.gate-btns b{display:block;font-size:20px;font-weight:600}
.gate-btns span{font-size:12px;opacity:.6;letter-spacing:1px}

/* ---------- Toolbar ---------- */
.toolbar{position:fixed;top:16px;right:16px;z-index:20;display:flex;gap:8px}
.seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;color:var(--ink-2);font:600 12px "Be Vietnam Pro";padding:7px 13px;border-radius:999px;cursor:pointer;letter-spacing:.5px}
.seg button.on{background:var(--navy);color:#fff}
:root[data-theme="dark"] .seg button.on{background:var(--accent)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow)}

/* ---------- Layout ---------- */
.wrap{max-width:1200px;margin:0 auto;padding:72px 16px 64px}
.sheet{background:var(--paper);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-columns:310px 1fr}
aside{background:var(--navy);color:#e9ecf3;padding:40px 30px}
main{padding:44px 46px;min-width:0}

/* sidebar */
.photo{width:100%;aspect-ratio:4/5;border-radius:16px;object-fit:cover;object-position:center 25%;display:block}
.name{font-family:"Playfair Display",serif;font-size:31px;line-height:1.15;margin:24px 0 10px;color:#fff}
.roles{display:flex;flex-wrap:wrap;gap:6px}
.roles span{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:3px 8px;color:rgba(255,255,255,.8)}
.snap{margin-top:22px;background:rgba(255,255,255,.06);border-radius:16px;padding:16px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));align-self:start}
.snap-h{grid-column:1/-1;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);font-weight:600;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 10px}
.snap-h span{letter-spacing:.5px;text-transform:none;font-weight:500;opacity:.7}
.snap-stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.snap-stat{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 10px 9px;text-align:center}
.snap-stat b{display:block;font-family:"Playfair Display",serif;font-size:24px;line-height:1.1}
.snap-stat small{display:block;font-size:10.5px;line-height:1.3;margin-top:3px;opacity:.75}
.snap-card{background:rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.45}
.snap-card small{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;opacity:.65;margin-bottom:6px}
.snap-card b{display:block;font-size:14px}
.snap-card .muted{opacity:.75}
.snap-card ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.snap-card li{display:flex;gap:8px}
.snap-card li i{font-style:normal;flex:none}
.snap-path{grid-column:1/-1}
.snap-seg{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;margin:4px 0 8px}
.snap-seg div{background:var(--c);min-width:6px}
.snap-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px}
.snap-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px}
.side-h{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);margin:32px 0 14px;font-weight:600}
.contact li{list-style:none;display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;font-size:13.5px}
.contact svg{flex:none;width:16px;height:16px;margin-top:3px;opacity:.7}
.contact small{display:block;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.45)}
.contact a:hover{color:var(--gold)}
.strengths li{list-style:none;font-size:13px;padding:9px 0 9px 22px;position:relative;border-bottom:1px dashed rgba(255,255,255,.1);color:rgba(255,255,255,.85)}
.strengths li:before{content:"";position:absolute;left:2px;top:16px;width:8px;height:8px;border-radius:2px;background:var(--gold);transform:rotate(45deg)}
.edu-card{background:var(--navy-2);border-radius:14px;padding:18px}
.edu-card .school{font-weight:600;font-size:13.5px;line-height:1.4;color:#fff}
.edu-card .yrs{font-size:12px;color:var(--gold);margin:4px 0 8px}
.edu-card p{font-size:12.5px;color:rgba(255,255,255,.75);margin-top:6px}
.gpa{display:flex;align-items:baseline;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1)}
.gpa b{font-family:"Playfair Display",serif;font-size:34px;color:#fff;line-height:1}
.gpa span{font-size:12px;color:rgba(255,255,255,.55)}

/* main */
.sec{margin-bottom:46px}
.sec:last-child{margin-bottom:0}
.sec-h{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.sec-h h2{font-family:"Playfair Display",serif;font-size:25px;font-weight:700;white-space:nowrap}
.sec-h .num{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:1px}
.sec-h:after{content:"";flex:1;height:1px;background:var(--line)}
.summary{font-size:15.5px;color:var(--ink-2);line-height:1.8;border-left:3px solid var(--accent);padding-left:20px}

/* ---------- Dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi b{font-family:"Playfair Display",serif;font-size:32px;line-height:1;display:block;color:var(--ink)}
.kpi b em{font-style:normal;color:var(--accent)}
.kpi span{font-size:11.5px;color:var(--muted);display:block;margin-top:8px;line-height:1.35}
.dash{display:grid;grid-template-columns:1fr 1.15fr;gap:16px}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.panel.wide{grid-column:1/-1}
.panel h3{font-size:12px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;letter-spacing:0;text-transform:none;font-weight:500}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* category cards */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative;overflow:hidden}
.cat:before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--c)}
.cat .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);margin-bottom:12px}
.cat .ic svg{width:18px;height:18px}
.cat h4{font-size:14px;font-weight:600;line-height:1.35;margin-bottom:4px}
.cat .cnt{font-size:11px;color:var(--muted);margin-bottom:10px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tags span{font-size:11.5px;background:var(--chip);border-radius:6px;padding:3px 8px;color:var(--ink-2);line-height:1.4}

/* matrix */
.matrix{width:100%;border-collapse:separate;border-spacing:4px;font-size:12.5px}
.matrix th{font-weight:600;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:0 2px 6px;text-align:center}
.matrix th:first-child{text-align:left}
.matrix td{height:30px}
.matrix td.lbl{color:var(--ink);font-weight:500;padding-right:8px;white-space:nowrap}
.matrix td.cell{border-radius:7px;background:var(--cell-off);width:12%}
.matrix td.cell.on{background:var(--c)}
.matrix td.bar{width:22%;padding-left:8px}
.bar-track{height:8px;background:var(--cell-off);border-radius:99px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:99px;background:var(--c);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar-n{font-size:11px;color:var(--muted);margin-top:3px}

/* gantt */
.gantt{position:relative;padding-top:24px}
.g-axis{position:absolute;top:0;left:0;right:0;height:100%;display:grid}
.g-axis div{border-left:1px dashed var(--line);font-size:10.5px;color:var(--muted);padding-left:5px}
.g-row{position:relative;height:34px;margin-bottom:6px}
.g-bar{position:absolute;top:0;height:100%;border-radius:8px;background:var(--c);color:#fff;font-size:11.5px;font-weight:600;display:flex;align-items:center;padding:0 10px;white-space:nowrap;overflow:visible;min-width:8px}
.g-bar.short span{position:absolute;left:calc(100% + 8px);color:var(--ink);font-weight:600}
.g-bar.short.flip span{left:auto;right:calc(100% + 8px)}
.g-bar.edu{background:transparent;border:1.5px dashed var(--muted);color:var(--ink-2)}

/* tools donut + platform chips */
.tool-grp{margin-bottom:14px}
.tool-grp:last-child{margin-bottom:0}
.tool-grp small{display:block;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.tool-grp .tags span{background:var(--paper);border:1px solid var(--line);font-weight:500;color:var(--ink)}

.donut-wrap{display:flex;align-items:center;gap:18px}
.donut-wrap svg{flex:none}
.donut-legend{font-size:12.5px;flex:1;min-width:0}
.donut-legend div{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--ink-2);line-height:1.3}
.donut-legend i{width:10px;height:10px;border-radius:3px;flex:none}
.donut-legend b{margin-left:auto;color:var(--ink);font-weight:600;padding-left:10px}

/* ---------- Experience ---------- */
.job{display:grid;grid-template-columns:120px 1fr;gap:22px;position:relative;padding-bottom:28px}
.job:last-child{padding-bottom:0}
.job .when{font-size:12px;font-weight:600;color:var(--accent);padding-top:3px;line-height:1.5}
.job .when small{display:block;color:var(--muted);font-weight:500}
.job .body{border-left:1px solid var(--line);padding-left:22px;position:relative}
.job .body:before{content:"";position:absolute;left:-6px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--paper);border:2.5px solid var(--accent)}
.job .co{font-weight:700;font-size:16px;letter-spacing:.2px}
.job .role{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:2px 0 12px;font-weight:600}
.job ul{padding-left:0}
.job li{list-style:none;position:relative;padding-left:16px;margin-bottom:6px;color:var(--ink-2);font-size:14px}
.job li:before{content:"";position:absolute;left:0;top:10px;width:6px;height:1.5px;background:var(--accent)}
.award{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 8px;font-weight:600}

footer{text-align:center;font-size:12px;color:var(--muted);margin-top:22px}

/* reveal */
.rv{opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}
.rv.in{opacity:1;transform:none}

/* ---------- Responsive ---------- */
@media (max-width:980px){
  .sheet{grid-template-columns:minmax(0,1fr)}
  aside{display:grid;grid-template-columns:200px 1fr;gap:0 28px;padding:30px}
  aside{grid-template-areas:"photo name" "photo roles" "photo snap" "contact snap" "rest rest";grid-template-rows:auto auto 1fr auto;align-items:start}
  aside .photo{grid-area:photo}
  aside .name{grid-area:name}
  aside .roles{grid-area:roles}
  aside .snap{grid-area:snap;margin-top:18px}
  aside .contact-block{grid-area:contact;align-self:end}
  aside .contact-block .side-h{margin-top:28px}
  .snap-stats{grid-template-columns:repeat(4,1fr)}
  .name{margin-top:0}
  .side-block{grid-column:1/-1}
  .cats{grid-template-columns:1fr 1fr}
}
@media (max-width:680px){
  .wrap{padding:64px 12px 40px}
  aside{display:block;padding:26px 20px}
  aside .photo{max-width:220px;margin:0 auto}
  .name{text-align:center;margin-top:20px}
  .roles{justify-content:center}
  .snap-stats{grid-template-columns:repeat(2,1fr)}
  main{padding:28px 18px}
  .kpis{grid-template-columns:1fr 1fr}
  .dash{grid-template-columns:minmax(0,1fr)}
  .cats{grid-template-columns:minmax(0,1fr)}
  .panel{padding:16px 14px}
  .g-bar{font-size:10.5px;padding:0 7px}
  .job{grid-template-columns:1fr;gap:6px}
  .job .when small{display:inline;margin-left:6px}
  .matrix td.lbl{white-space:normal;font-size:12px;width:44%;line-height:1.3}
  .matrix td{height:26px}
  .sec-h h2{white-space:normal;font-size:22px;line-height:1.2}
  .matrix th{font-size:9px;letter-spacing:0}
  .matrix td.bar{display:none}
  .donut-wrap{flex-direction:column;align-items:flex-start}
  .gate-btns{grid-template-columns:1fr}
}

/* ---------- Print ---------- */
@media print{
  #gate,.toolbar{display:none!important}
  body{background:#fff}
  .wrap{padding:0;max-width:none}
  .sheet{box-shadow:none;border-radius:0}
  .rv{opacity:1;transform:none}
  .panel,.cat,.job{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ---------- Soft skills ---------- */
.soft-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.soft{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;gap:14px;align-items:flex-start}
.soft b.n{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:"Playfair Display",serif;font-size:15px}
.soft h4{font-size:14.5px;font-weight:600;line-height:1.35;margin-bottom:5px;color:var(--ink)}
.soft p{font-size:13.5px;line-height:1.6;color:var(--ink-2)}
@media (max-width:680px){.soft-grid{grid-template-columns:minmax(0,1fr)}.soft{padding:16px}}

/* ---------- Pink gradient theme ---------- */
:root:not([data-theme="dark"]) body{background:linear-gradient(165deg,#f7c3cc 0%,#f9d9df 28%,#fcecef 55%,#fff 85%) fixed}
:root:not([data-theme="dark"]) #gate{background:linear-gradient(165deg,#f7c3cc 0%,#f9d9df 35%,#fdf0f2 65%,#fff 100%);color:var(--ink)}
:root:not([data-theme="dark"]) .gate-photo{border-color:#fff}
:root:not([data-theme="dark"]) .gate-sub{color:var(--ink-2)}
:root:not([data-theme="dark"]) .gate-btns button{border-color:rgba(212,96,124,.25);background:rgba(255,255,255,.55);color:var(--ink)}
:root:not([data-theme="dark"]) .gate-btns button:hover{background:var(--accent);color:#fff}
:root:not([data-theme="dark"]) .sheet{background:rgba(255,255,255,.72);backdrop-filter:blur(8px)}
:root:not([data-theme="dark"]) aside{background:linear-gradient(180deg,#f6bfca 0%,#f9d6dd 45%,#fdeef1 100%);color:var(--ink)}
:root:not([data-theme="dark"]) .name{color:var(--ink)}
:root:not([data-theme="dark"]) .roles span{border-color:rgba(122,59,92,.25);color:var(--c2);background:rgba(255,255,255,.45)}
:root:not([data-theme="dark"]) .contact small{color:var(--ink-2);opacity:.75}
:root:not([data-theme="dark"]) .strengths li{color:var(--ink);border-bottom-color:rgba(122,59,92,.15)}
:root:not([data-theme="dark"]) .edu-card{background:rgba(255,255,255,.7)}
:root:not([data-theme="dark"]) .edu-card .school,:root:not([data-theme="dark"]) .gpa b{color:var(--ink)}
:root:not([data-theme="dark"]) .edu-card p,:root:not([data-theme="dark"]) .gpa span{color:var(--ink-2)}
:root:not([data-theme="dark"]) .gpa{border-top-color:rgba(122,59,92,.15)}
:root:not([data-theme="dark"]) .seg button.on{background:var(--accent)}
:root:not([data-theme="dark"]) .snap{background:rgba(255,255,255,.5);color:var(--ink)}
:root:not([data-theme="dark"]) .snap-stat,:root:not([data-theme="dark"]) .snap-card{background:rgba(255,255,255,.75)}
:root:not([data-theme="dark"]) .snap-stat b{color:var(--accent)}
:root:not([data-theme="dark"]) .panel,:root:not([data-theme="dark"]) .kpi,:root:not([data-theme="dark"]) .soft{background:rgba(253,243,245,.8)}
</style>
</head>
<body>

<!-- Language gate -->
<div id="gate">
  <div class="gate-box">
    <img class="gate-photo" src="photo.jpg" alt="Bùi Thị Tú Anh">
    <div class="gate-name">Bùi Thị Tú Anh</div>
    <div class="gate-sub">Curriculum Vitae</div>
    <div class="gate-btns">
      <button data-pick="vi"><b>Tiếng Việt</b><span>XEM CV</span></button>
      <button data-pick="en"><b>English</b><span>VIEW CV</span></button>
    </div>
  </div>
</div>

<div class="toolbar">
  <div class="seg" id="langSeg">
    <button data-lang="vi">VI</button>
    <button data-lang="en">EN</button>
  </div>
  <button class="icon-btn" id="themeBtn" aria-label="Theme">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>

  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.6 7.6"/><circle cx="11" cy="11" r="2"/></svg>'
];
const TOOLS = [
  ["grp_plat",["TikTok Shop","Shopee","Lazada","Website"]],
  ["grp_ops",["Pancake","POS","Livestream"]],
  ["grp_ship",["J&T","GHTK","SPX"]],
  ["grp_ch",["WhatsApp","Instagram","Email"]],
  ["grp_office",["Adobe Illustrator","MS Office","Google Workspace"]]
];

const mIdx = ([y,m]) => y*12 + (m-1);
const months = c => mIdx(c.e||NOW) - mIdx(c.s) + 1;
const fmt = (ym, L) => ym ? String(ym[1]).padStart(2,"0")+"/"+ym[0] : T[L].present;

/* ================= RENDER ================= */
const $ = s => document.querySelector(s);
let lang = "vi";

function render(L, silent){
  lang = L; const t = T[L];
  document.documentElement.lang = L;
  document.querySelectorAll("[data-t]").forEach(el => { if(t[el.dataset.t]!=null) el.textContent = t[el.dataset.t]; });
  document.querySelectorAll("#langSeg button").forEach(b => b.classList.toggle("on", b.dataset.lang===L));
  document.title = "Bùi Thị Tú Anh — " + (L==="vi" ? "CV" : "Resume");

  /* At-a-glance profile dashboard */
  {
    const tm = mIdx(NOW) - mIdx(COMPANIES[COMPANIES.length-1].s) + 1;
    const h = COMPANIES[0], award = t.jobs[4].items.find(x=>x.startsWith("@")).slice(1);
    const path = [...COMPANIES].reverse();
    $("#snap").innerHTML = `
      <div class="snap-h">${t.snap_t}<span>${fmt(COMPANIES[COMPANIES.length-1].s,L)} – ${fmt(h.e,L)}</span></div>
      <div class="snap-stats">
        <div class="snap-stat"><b>${Math.floor(tm/12)}+</b><small>${t.k_years}</small></div>
        <div class="snap-stat"><b>${COMPANIES.length}</b><small>${t.k_roles}</small></div>
        <div class="snap-stat"><b>4.0</b><small>${t.k_gpa}</small></div>
        <div class="snap-stat"><b>3</b><small>${t.k_plat}</small></div>
      </div>
      <div class="snap-card"><small>${t.snap_latest}</small><b>${h.co}</b><div>${t.jobs[0].role}</div><div class="muted">${fmt(h.s,L)} – ${fmt(h.e,L)} · ${months(h)} ${t.months}</div></div>
      <div class="snap-card"><small>${t.snap_award}</small><ul><li><i>★</i><span>${award}</span></li><li><i>🎓</i><span>${t.honor} · GPA 4.0/4.0</span></li></ul></div>
      <div class="snap-card snap-path"><small>${t.snap_path}</small>
        <div class="snap-seg">${path.map(c=>`<div style="flex:${months(c)};--c:${DOM_COLORS[c.dom]}" title="${c.short} · ${months(c)} ${t.months}"></div>`).join("")}</div>
        <div class="snap-legend">${path.map(c=>`<span style="--c:${DOM_COLORS[c.dom]}"><i></i>${c.short} · ${months(c)}</span>`).join("")}</div>
      </div>`;
  }

  $("#softGrid").innerHTML = t.softList.map(([h,d],i)=>`<div class="soft"><b class="n">${String(i+1).padStart(2,"0")}</b><div><h4>${h}</h4><p>${d}</p></div></div>`).join("");

  /* Category cards */
  $("#cats").innerHTML = t.cats.map((c,i)=>`
    <div class="cat" style="--c:${CAT_COLORS[i]}">
      <div class="ic">${CAT_ICONS[i]}</div>
      <h4>${c.t}</h4>
      <div class="cnt">${c.tags.length} ${t.items}</div>
      <div class="tags">${c.tags.map(x=>`<span>${x}</span>`).join("")}</div>
    </div>`).join("");

  /* Donut — months by domain */
  const dm = [0,0,0,0]; COMPANIES.forEach(c=> dm[c.dom] += months(c));
  const tot = dm.reduce((a,b)=>a+b,0);
  const R = 52, C = 2*Math.PI*R; let off = 0;
  const arcs = dm.map((v,i)=>{ const len = v/tot*C; const s = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${DOM_COLORS[i]}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`; off += len; return s; }).join("");
  $("#donut").innerHTML = `
    <svg width="124" height="124" viewBox="0 0 140 140">${arcs}
      <text x="70" y="68" text-anchor="middle" font-family="Playfair Display" font-size="26" font-weight="700" fill="var(--ink)">${tot}</text>
      <text x="70" y="86" text-anchor="middle" font-size="10.5" fill="var(--muted)" letter-spacing="1">${t.months.toUpperCase()}</text>
    </svg>
    <div class="donut-legend">${dm.map((v,i)=>`<div><i style="background:${DOM_COLORS[i]}"></i>${t.focus[i]}<b>${Math.round(v/tot*100)}%</b></div>`).join("")}</div>`;

  /* Tools */
  $("#tools").innerHTML = TOOLS.map(([k,list])=>`<div class="tool-grp"><small>${t[k]}</small><div class="tags">${list.map(x=>`<span>${x}</span>`).join("")}</div></div>`).join("");

  /* Jobs */
  $("#jobs").innerHTML = COMPANIES.map((c,i)=>{
    const j = t.jobs[i];
    return `<div class="job">
      <div class="when">${fmt(c.s,L)} –<br>${fmt(c.e,L)}<small>${months(c)} ${t.months}</small></div>
      <div class="body">
        <div class="co">${c.co}</div>
        <div class="role">${j.role}</div>
        <ul>${j.items.map(x=> x.startsWith("@") ? `<li><span class="award">★ ${x.slice(1)}</span></li>` : `<li>${x}</li>`).join("")}</ul>
      </div></div>`;
  }).join("");

  requestAnimationFrame(()=>setTimeout(animateBars,60));
  /* Keep the address bar clean so a reload or a copied link always opens the language choice */
}

function animateBars(){ document.querySelectorAll(".bar-fill").forEach(b=> b.style.width = b.dataset.w + "%"); }

/* Gate & toggles */
document.querySelectorAll("[data-pick]").forEach(b=> b.onclick = ()=>{ render(b.dataset.pick); $("#gate").classList.add("hide"); });
document.querySelectorAll("#langSeg button").forEach(b=> b.onclick = ()=> render(b.dataset.lang));
$("#themeBtn").onclick = ()=>{
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};

/* ?lang=vi|en skips the gate (useful for direct links) */
const q = new URLSearchParams(location.search).get("lang");
if(q==="vi"||q==="en"){ render(q); $("#gate").classList.add("hide"); } else { render("vi", true); }

/* reveal on scroll */
const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target);} }),{threshold:.08});
document.querySelectorAll(".rv").forEach(el=>io.observe(el));
</script>
</body>
</html>
